services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: placement_analytics
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-placement_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: python_etl/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: placement_analytics
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-placement_dev_password}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/placement_analytics?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-placement_dev_password}
      ANALYTICS_SERVICE_URL: http://analytics:5000
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
