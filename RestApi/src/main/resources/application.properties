spring.application.name=placement-analytics
server.port=8080

# Create the database first using sql/schema.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_analytics?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never

# Authentication. Override JWT_SECRET and the seeded passwords in any real deployment.
jwt.secret=${JWT_SECRET:local-dev-secret-key-change-me-32bytes!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.viewer.username=${VIEWER_USERNAME:viewer}
app.viewer.password=${VIEWER_PASSWORD:viewer123}
