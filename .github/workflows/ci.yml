name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: RestApi/pom.xml
      - name: Test backend
        working-directory: RestApi
        run: ./mvnw -B verify

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r RestApi/python_etl/requirements.txt
      - name: Test analytics
        run: python -m unittest discover -s RestApi/python_etl -v
